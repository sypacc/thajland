name: Publikovat dashboard

# Po každém pushi dat nebo webu (např. doplňkový sken z Claude rutiny) znovu sestaví React dashboard
# a publikuje ho na větev gh-pages. Ranní sken publikuje sám v scan.yml.
on:
  push:
    branches: [claude/wizardly-faraday-ivr6wi]
    paths: ["data/**", "web/**"]
  workflow_dispatch:

concurrency:
  group: pages-publish
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish:
    # commity ranního skenu publikuje scan.yml sám, nepublikovat dvakrát
    if: github.actor != 'thajland-bot'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Sestavit web (React/Vite)
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Připravit publikaci
        run: |
          rm -rf _site && mkdir -p _site
          cp -r web/dist/. _site/
          mkdir -p _site/data && cp data/*.json _site/data/ 2>/dev/null || true
          touch _site/.nojekyll
      - name: Publikovat dashboard (větev gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
          user_name: thajland-bot
          user_email: thajland-bot@users.noreply.github.com
          commit_message: "dashboard (publish) ${{ github.run_number }}"
