name: Sken letenek do Thajska

on:
  schedule:
    # Denně v 04:17 UTC (06:17 letního / 05:17 zimního času v ČR). GitHub cron = UTC.
    # GitHub plánované běhy občas zpozdí o hodiny nebo vynechá, proto dvě zálohy; brána níže zajistí,
    # že se plný sken za den udělá jen jednou.
    - cron: "17 4 * * *"
    - cron: "47 6 * * *"
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Omezit počet dotazů na jeden běh (test), prázdné = plný běh"
        required: false
        default: ""
      route:
        description: "Jen jedna trasa, např. PRG-HKT (diagnostika)"
        required: false
        default: ""
      max_stops:
        description: "Přepsat max. přestupů (číslo nebo none)"
        required: false
        default: ""
      no_save:
        description: "Jen test, neukládat data (true/false)"
        required: false
        default: "false"

concurrency:
  group: scan
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  gate:
    name: Má dnes běžet?
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Špička větve, ne commit připnutý při vytvoření běhu: záložní plánovaný běh může ve frontě
          # čekat za jiným skenem a brána musí vidět data, která ten sken právě zapsal.
          ref: ${{ github.ref_name }}
      - id: g
        run: |
          git fetch --quiet origin "${GITHUB_REF_NAME}" && git reset --quiet --hard "origin/${GITHUB_REF_NAME}"
          echo "brána čte data z commitu $(git rev-parse --short HEAD)" >&2
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib, datetime, os
          today = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d")
          p = pathlib.Path("data/latest.json")
          done = p.exists() and json.loads(p.read_text()).get("day") == today
          manual = os.environ.get("GITHUB_EVENT_NAME") != "schedule"
          print("run=" + ("true" if (manual or not done) else "false"))
          print(("dnešní sken už existuje, záložní termín přeskočen" if done and not manual else "spouštím"), file=__import__("sys").stderr)
          PY
  scan:
    name: Sken ${{ matrix.route }}
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        route: [PRG-BKK, PRG-HKT, VIE-BKK, VIE-HKT]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Instalace závislostí
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt playwright pytest
          python -m playwright install --with-deps chromium
      - name: Testy
        run: python -m pytest -q tests
      - name: Sken (každý dotaz = čistý požadavek bez cookies, tj. "anonymní okno")
        env:
          PYTHONUNBUFFERED: "1"
          THAJLAND_DEBUG_DIR: debug
        run: |
          ARGS="--route ${{ matrix.route }} --partial-out partial/${{ matrix.route }}.json"
          if [ -n "${{ github.event.inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"; fi
          # diagnostika jedné trasy: ostatní joby jen rychle skončí bez dotazů
          if [ -n "${{ github.event.inputs.route }}" ] && [ "${{ github.event.inputs.route }}" != "${{ matrix.route }}" ]; then ARGS="$ARGS --limit 0"; fi
          if [ -n "${{ github.event.inputs.max_stops }}" ]; then ARGS="$ARGS --max-stops ${{ github.event.inputs.max_stops }}"; fi
          python -m scanner.run $ARGS
      - name: Ladicí report (do logu)
        if: always()
        run: |
          python - <<'PY'
          import pathlib, re
          d = pathlib.Path("debug")
          if not d.exists():
              print("bez ladicích souborů"); raise SystemExit
          for f in sorted(d.iterdir())[:12]:
              print(f"=== {f.name} ({f.stat().st_size} B)")
              if f.suffix == ".txt":
                  print(f.read_text(errors="ignore")[:2500])
              elif f.suffix == ".html":
                  h = f.read_text(errors="ignore")
                  t = re.search(r"<title>(.*?)</title>", h, re.S)
                  print("title:", (t.group(1).strip() if t else "?"))
                  txt = re.sub(r"<(script|style)[^>]*>.*?</\1>", " ", h, flags=re.S | re.I)
                  txt = re.sub(r"<[^>]+>", " ", txt); txt = re.sub(r"\s+", " ", txt)
                  print("text:", txt[:800])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: partial-${{ matrix.route }}
          path: partial/
          retention-days: 3
      - name: Ladicí výstupy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ matrix.route }}-${{ github.run_number }}
          path: debug/
          if-no-files-found: ignore
          retention-days: 7

  finalize:
    name: Sloučit, vyhodnotit, publikovat
    needs: [gate, scan]
    if: always() && needs.gate.outputs.run == 'true'
    
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Instalace závislostí
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          pattern: partial-*
          path: partial/
          merge-multiple: true
      - name: Finalizace (sloučení částí, příznaky, prodejci, hlášení)
        env:
          PYTHONUNBUFFERED: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: |
          ls -la partial/ || true
          ARGS="--merge 'partial/*.json'"
          if [ "${{ github.event.inputs.no_save }}" = "true" ]; then ARGS="$ARGS --no-save"; fi
          eval python -m scanner.run $ARGS
      - name: Shrnutí běhu
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          p = pathlib.Path("data/latest.json")
          if not p.exists():
              print("Žádná data."); raise SystemExit
          d = json.loads(p.read_text())
          s = d["stats"]
          print(f"## Sken {d['day']}\n")
          print(f"- termínů s nabídkou: **{s['queries_ok']}** / {s['queries_total']} (chyb {s['queries_error']}, přeskočeno {s['queries_skipped']}, převzato z minula {s['queries_stale']}, nově v prodeji {s.get('queries_new', 0)})")
          print(f"- nabídek: {s['offers']}, nejnižší cena: **{s['min_price']} {d['config']['currency']}** / os., medián minim: {s['median_min_price']}")
          print(f"- trvání: {s['duration_s']} s, částí: {s.get('parts')}, Google vypnut pro blokaci: {s['google_disabled']}\n")
          al = d.get("alerts_today") or []
          print(f"### Hlášení: {len(al)}\n")
          for a in al[:15]:
              print(f"- **{a['price']} {a['currency']}/os** {a['origin']}→{a['destination']} {a['depart_date']}→{a['return_date']} · {', '.join(a['airlines'])} · {a['kind_label']} – {a['reason']}")
          print()
          top = sorted([o for o in d["offers"] if o.get("score") is not None], key=lambda o: o["score"])[:10]
          if top:
              print("| skóre | cena/os | trasa | odlet | návrat | aerolinky | přestupy |")
              print("|---|---|---|---|---|---|---|")
              for o in top:
                  print(f"| {o['score']} | {o['price']} | {o['route']} | {o['depart_date']} | {o['return_date']} | {', '.join(o['airlines'])} | {o['stops']} |")
          PY
      - name: Commit dat
        if: always()
        run: |
          git config user.name "thajland-bot"
          git config user.email "thajland-bot@users.noreply.github.com"
          # finalizace mění i watchlist.yaml (automatické tipy) – musí jít do commitu, jinak rebase selže
          git add -A data watchlist.yaml
          if git diff --cached --quiet; then
            echo "Žádná změna dat."
          else
            git commit -m "data: sken $(date -u +%Y-%m-%d)"
            for i in 1 2 3 4; do
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
              echo "push selhal (pokus $i), zkouším znovu"; sleep $((i * 5))
            done
            git log --oneline -1 origin/"${GITHUB_REF_NAME}" || true
            git fetch origin "${GITHUB_REF_NAME}" && git diff --quiet HEAD "origin/${GITHUB_REF_NAME}" -- data || { echo "::error::Data se nepodařilo pushnout"; exit 1; }
          fi
      - uses: actions/setup-node@v4
        if: always()
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Sestavit web (React/Vite)
        if: always()
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Připravit publikaci
        if: always()
        run: |
          rm -rf _site && mkdir -p _site
          cp -r web/dist/. _site/
          mkdir -p _site/data && cp data/*.json _site/data/ 2>/dev/null || true
          touch _site/.nojekyll
      # Publikace na větev gh-pages (Pages: Deploy from a branch → gh-pages). URL: https://sypacc.github.io/thajland/
      - name: Publikovat dashboard (větev gh-pages)
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
          user_name: thajland-bot
          user_email: thajland-bot@users.noreply.github.com
          commit_message: "dashboard ${{ github.run_number }}"
