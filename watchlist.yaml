# Sledované lety (priorita ve skenu, vlastní historie a hlášení při změně ceny).
#
# Přidání z dashboardu: tlačítko „Sledovat“ u nabídky otevře předvyplněné GitHub issue;
# workflow ho zpracuje, zapíše sem a issue zavře. Ručně lze editovat i přímo tento soubor.
#
# Každá položka: odlet/cíl (IATA), datum odletu a návratu; volitelně itinerář (aerolinky, trasa, čas odletu),
# aby se hlídala cena stejného letu, ne jen nejlevnější na termín; poznámka.
auto:
  enabled: true     # automaticky sledovat nejlepší dealy z každého skenu
  top: 5            # kolik nejlepších (podle skóre) držet ve sledování
  keep_days: 10     # jak dlouho nechat automaticky přidaný let ve sledování, když vypadne z top N

watch: []
