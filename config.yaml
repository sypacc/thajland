# Konfigurace sledování letenek do Thajska (léto 2027)
# Všechny hodnoty lze měnit; scanner si je načte při každém běhu.

trip:
  # Odkud létáme (IATA kódy). PRG = Praha, VIE = Vídeň (častá levnější alternativa z Česka).
  origins: [PRG, VIE]
  # Kam (BKK = Bangkok Suvarnabhumi, HKT = Phuket). Případně přidej DMK, CNX, USM, KBV.
  destinations: [BKK, HKT]
  # Okno odletů (včetně) a krok mezi testovanými odlety ve dnech (1 = každý den srpna i září).
  depart_from: "2027-08-01"
  depart_to: "2027-09-30"
  depart_step_days: 1
  # Délka pobytu ve dnech (odlet -> návrat). "2 týdny" = 13–15 dní, "2,5–3 týdny" = 17–22 dní.
  # Cena u většiny aerolinek na délce pobytu skoro nezávisí, rozhodují dny odletu a návratu; delší délky
  # hlavně otevřou levnější návraty ve druhé polovině září.
  trip_lengths: [13, 14, 15, 17, 18, 19, 20, 21, 22]
  # Dotaz běží pro 1 dospělého (cena za osobu). Kolik vás letí – jen pro zobrazení celkové ceny.
  travelers: 2
  cabin: economy
  currency: CZK
  # Max. počet přestupů v dotazu na Google Flights (null = bez omezení).
  max_stops: 2

scan:
  # Prodleva mezi dotazy (s), aby nás Google nezačal blokovat.
  delay_seconds: 3.0
  jitter_seconds: 2.0
  retries: 3
  # Prodejní okno aerolinek: návraty dál než N dní dopředu Google typicky ještě nenabízí (ověřeno: návraty do 329 dní).
  # Takové dotazy se zkouší jen jedním pokusem; uvnitř okna se prázdná odpověď vždy opakuje a ověřuje.
  booking_horizon_days: 329
  # Pojistka proti nekonečným běhům (platí pro jeden běh; v Actions běží Praha a Vídeň paralelně).
  max_queries: 1000
  time_budget_minutes: 80
  # Kolik nabídek z každého dotazu uložit (seřazeno podle skóre).
  keep_per_query: 6
  # Zdroje: google = Google Flights (hlavní). azair = Azair.eu – vypnuto: pro termíny ~10 měsíců
  # dopředu vrací "dotaz je pro vyhledávací server příliš rozsáhlý" (hledá jen pár měsíců dopředu).
  sources:
    google: true
    azair: false
  # Když selže primp fetch Google Flights, zkusí se headless Chromium (Playwright) v anonymním kontextu.
  playwright_fallback: true
  # Experimentální: pro N nejlepších dealů otevřít Google Flights v headless Chromiu
  # a přečíst "Možnosti rezervace" = u koho (aerolinka / cestovka) a za kolik se dá koupit.
  enrich_sellers: true
  enrich_sellers_top: 6

# Skóre "cena/výkon": ke skutečné ceně přičítáme "virtuální" náklady za nepohodlí.
# Výsledek = efektivní cena v Kč; čím nižší, tím lepší nabídka.
scoring:
  # Pohodlná referenční doba cesty tam (minuty). Nad ni se penalizuje každá hodina.
  baseline_duration_min: 840      # 14 h
  czk_per_extra_hour: 250
  # Penalizace za každý přestup nad první (1 přestup je u Thajska norma).
  czk_per_extra_stop: 1500
  # Bonus za přímý let (záporné = zvýhodnění).
  czk_direct_bonus: -1500
  # Dlouhé přestupy: nad tuto hranici (min) penalizace za každou hodinu navíc.
  layover_comfort_max_min: 300    # 5 h
  czk_per_long_layover_hour: 300
  # Krátké přestupy pod touto hranicí (min) = riziko nestihnutí.
  layover_risky_min: 60
  czk_risky_layover: 800
  # Aerolinky: kladné = horší (připočte se), záporné = lepší (odečte se).
  airline_adjust_czk:
    "Emirates": -1200
    "Qatar Airways": -1800   # preferovaná aerolinka (viz preferred níže)
    "Singapore Airlines": -1200
    "EVA Air": -1000
    "Cathay Pacific": -800
    "Etihad": -800
    "Turkish Airlines": -600
    "THAI": -600             # Thai Airways; Google ji píše jako „THAI“, skener hledá název jako podřetězec
    "Austrian": -300
    "Lufthansa": -300
    "Swiss": -300
    "KLM": -300
    "Air France": -300
    "Finnair": -200
    "Oman Air": -200
    "Saudia": 500
    "Air China": 800
    "China Eastern": 800
    "China Southern": 800
    "Hainan": 400
    "Air Arabia": 800
    "flydubai": 500
    "Wizz Air": 1000
    "Pegasus": 600
    "Aeroflot": 3000
    "Air Astana": 400
    "Uzbekistan Airways": 600
    "Air Serbia": 300
    "Air India": 600
    "Scoot": 800
    "Norse Atlantic": 600
    "Ethiopian": 700
    "Egyptair": 700
    "Kuwait Airways": 800
    "Gulf Air": 300
    "SriLankan": 300

# Preferovaná aerolinka: dostane prioritu napříč systémem – vlastní cenová hranice pro hlášení,
# hlášení při každém novém minimu, rezervovaná místa v automatických tipech, přednostní znovuověření
# nejlevnějších termínů v doplňkovém skenu a vlastní záložka na dashboardu.
preferred:
  airlines: ["Qatar Airways"]
  # Hlášení, jakmile preferovaná aerolinka klesne pod tuto cenu za osobu (nezávisle na alerts.target_price).
  target_price: 14000
  # Kolik míst v automatických tipech je rezervováno pro nejlevnější let preferované aerolinky (na každou destinaci jedno).
  reserve_tips: 2
  # Kolik nejlevnějších termínů preferované aerolinky znovu ověřit v doplňkovém skenu (být první, kdo pokles uvidí).
  recheck_top: 8
  # „Nové minimum“ hlásit až při poklesu aspoň o tolik Kč (kurzové kolísání o pár korun není zpráva).
  new_low_min_drop_czk: 250
  # Prémiová skupina: aerolinky stejné nebo lepší úrovně než preferovaná. Sledují se jejich minima po trasách,
  # hlásí se pád pod peer_target_price a „zázračná sleva“ = pokles o peer_drop_pct % a víc proti dosavadnímu
  # minimu té aerolinky na trase. Nejlevnější termíny se znovu ověřují v doplňkovém skenu (peer_recheck_top).
  peers: ["Emirates", "EVA Air", "Singapore Airlines", "Cathay Pacific", "Etihad"]
  peer_target_price: 14000
  peer_drop_pct: 20
  peer_recheck_top: 4

# Hlášení (alerty) – kdy považovat nabídku za abnormálně nízkou / zajímavý deal.
alerts:
  enabled: true
  # Cílová cena za osobu: cokoliv pod ní hlásíme vždy ("deal").
  target_price: 15000
  # Prudký pokles proti předchozímu běhu (stačí splnit jedno).
  drop_pct: 12
  drop_czk: 2500
  # Abnormálně nízko: o X % pod mediánem historických minim daného termínu (potřeba min. N běhů).
  anomaly_pct: 15
  anomaly_min_days: 5
  # Nové historické minimum celé trasy (potřeba min. N běhů).
  route_low_min_days: 3
  # Max. počet hlášení za jeden běh (nejlepší podle závažnosti a skóre).
  max_per_run: 8
  # Stejný termín neopakovat dřív než za N dní, pokud cena neklesla o dalších X Kč.
  dedupe_days: 7
  dedupe_improve_czk: 500
  # Sledovaný let „na minimu“ hlásit až při poklesu aspoň o tolik Kč proti minulému měření.
  watch_low_min_czk: 250
  # Kanály: posílá se jen tam, kde jsou nastavené secrets (viz README).
  channels:
    github_issue: true   # issue v repu -> GitHub notifikace / e-mail (funguje bez nastavení)
    telegram: true       # TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID
    ntfy: true           # NTFY_TOPIC (push do mobilu přes ntfy.sh)
    email: true          # SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS, ALERT_EMAIL_TO
